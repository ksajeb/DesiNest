server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8096
          predicates:
            - Path=/users/**

        - id: booking-service
          uri: http://localhost:8098
          predicates:
            - Path=/bookings/**

        - id: payment-service
          uri: http://localhost:8099
          predicates:
            - Path=/payments/**

        - id: listing-service
          uri: http://localhost:8097
          predicates:
            - Path=/listings/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

logging:
  level:
    org.springframework.cloud.gateway: INFO